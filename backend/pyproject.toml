[project]
name = "fitness_business_os"
version = "0.1.0"
description = "Fitness Business OS backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "docformatter>=1.7.8",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
    "asyncpg>=0.31.0",
    "mako>=1.4.1",
    "pytest>=9.1.1",
    "PyJWT[crypto]>=2.10.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
testpaths = ["tests"]

[tool.docformatter]
recursive = true
wrap-summaries = 88
wrap-descriptions = 88
blank = true
pre-summary-newline = true
make-summary-multi-line = true
close-quotes-on-newline = true

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]
